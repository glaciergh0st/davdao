<!doctype html>
<html lang="{{LANG}}" dir="{{DIR}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#08090b">
  <meta name="description" content="{{DESCRIPTION}}">
  {{CANONICAL_LINK}}
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests">
  <title>{{TITLE}} — {{BRAND_NAME}}</title>
  <link rel="stylesheet" href="/assets/styles.css">
  <script src="/assets/content.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">{{SKIP_LABEL}}</a>
  {{SIDE_NAV}}
  {{MESSAGE_SHORTCUT}}
  <header class="site-header"><div class="container header-inner"><a class="brand" href="/" aria-label="{{BRAND_ARIA}}"><span class="brand-name">{{BRAND_NAME}}</span><span class="brand-byline">{{BRAND_BYLINE}}</span></a><nav aria-label="{{NAV_LABEL}}" data-content-nav>{{NAV_LINKS}}</nav></div></header>
  <main id="main" class="container project-page" data-project-page="{{PROJECT_SLUG}}">
    <p class="eyebrow"><a href="/#work" data-bind="project.workLabel">{{WORK_LABEL}}</a> / <span data-bind="project.status">{{STATUS}}</span></p>
    <h1 data-bind="project.title">{{TITLE}}</h1>
    <p class="project-deck" data-bind="project.summary">{{SUMMARY}}</p>
    <div class="project-meta" data-bind="project.tags">{{TAGS}}</div>
    <article class="prose" data-bind="project.writeup">{{BODY}}</article>
    <p class="project-back"><a class="text-link" href="/#work">← {{BACK_TO_WORK}}</a></p>
  </main>
  <footer class="container footer"><span data-bind="footer">{{FOOTER}}</span><nav class="footer-social-links" aria-label="Social links" data-social-links>{{SOCIAL_LINKS}}</nav><a href="/" data-bind="labels.home">{{BACK_HOME}}</a></footer>
</body>
</html>
